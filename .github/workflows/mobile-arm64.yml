name: Vampire Mobile ARM64 QEMU boot

concurrency:
  group: vampire-mobile-arm64-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "build/vampire_mobile_qemu_defconfig"
      - "build/vampire_mobile_qemu.fragment"
      - "build/build-mobile-qemu.sh"
      - "mobile/rootfs-overlay/**"
      - ".github/workflows/mobile-arm64.yml"
  pull_request:
    paths:
      - "build/vampire_mobile_qemu_defconfig"
      - "build/vampire_mobile_qemu.fragment"
      - "build/build-mobile-qemu.sh"
      - "mobile/rootfs-overlay/**"
      - ".github/workflows/mobile-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Buildroot and QEMU host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio file flex git libelf-dev libncurses-dev libssl-dev patch perl python3 qemu-system-arm rsync unzip wget
      - name: Build ARM64 kernel and initramfs
        env:
          JOBS: "2"
        run: build/build-mobile-qemu.sh
      - name: Boot the image in QEMU
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 60s qemu-system-aarch64 \
            -machine virt -cpu cortex-a57 -m 1024 \
            -kernel out/mobile-arm64/Image \
            -initrd out/mobile-arm64/rootfs.cpio.gz \
            -append "console=ttyAMA0,115200 rdinit=/sbin/init" \
            -nographic -no-reboot > qemu-mobile-boot.log 2>&1
          status=$?
          set -e
          cat qemu-mobile-boot.log
          if [[ $status -ne 124 && $status -ne 0 ]]; then
            echo "QEMU exited unexpectedly with status $status"
            exit "$status"
          fi
          grep -q "VAMPIRE MOBILE OS" qemu-mobile-boot.log
          grep -q "ttyAMA0" qemu-mobile-boot.log
      - name: Upload ARM64 boot artifacts and serial log
        uses: actions/upload-artifact@v4
        with:
          name: vampire-mobile-arm64-qemu-bringup
          path: |
            out/mobile-arm64/Image
            out/mobile-arm64/rootfs.cpio.gz
            out/mobile-arm64/SHA256SUMS
            qemu-mobile-boot.log
          if-no-files-found: error
