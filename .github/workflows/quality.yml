name: Vampire OS quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vampire-os-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: Source validation and regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Python syntax
        run: python -m compileall -q scripts tests vpm fetch rootfs-overlay/usr/lib/vampire

      - name: Validate mobile portal JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check mobile portal JavaScript syntax
        run: node --check mobile/app.js && node --check mobile/sw.js

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$(head -n 1 "$file")" in
              *"/bash"*) bash -n "$file" ;;
              *"/sh"*) sh -n "$file" ;;
            esac
          done < <(find scripts rootfs-overlay/usr/bin rootfs-overlay/usr/lib/vampire build -type f -print0)

      - name: Run Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run safe command regression tests
        run: |
          bash tests/test-weston-launchers.sh
          bash tests/test-vfetch.sh
          bash tests/test-command-tools.sh
          bash tests/test-vdisplay.sh
          bash tests/test-vpower.sh
          bash tests/test-rootfs-artifact.sh
          bash tests/test-session-runtime.sh
          bash tests/test-graphical-preflight.sh
          bash tests/test-vampire-shell.sh
          bash tests/test-vampire-completion.sh
          bash tests/test-ssh-tool.sh
          bash tests/test-settings-desktop.sh
          bash tests/test-desktop-graphical-menu.sh
          bash tests/test-installed-disk-harness.sh
          bash tests/test-installer-confirmation.sh
          bash tests/test-installer-preflight.sh
          bash tests/test-installer-requirements.sh
          bash tests/test-installer-stage.sh
          bash tests/test-installer-configure.sh
          bash tests/test-post-fakeroot-vampire.sh
