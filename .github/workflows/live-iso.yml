name: Vampire OS live ISO

# ISO builds are expensive and must not be cancelled by a later source push.
# Keep one active build and only the newest pending revision in the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v0.*"
    paths:
      - "build/**"
      - "rootfs-overlay/**"
      - "fetch/vfetch"
      - "vpm/**"
      - "scripts/test-live-iso.sh"
      - "scripts/test-rootfs-artifact.sh"
      - "scripts/post-build-vampire.py"
      - "scripts/stage-rootfs.py"
      - "scripts/test_post_build_vampire.py"
      - "tests/test-uefi-boot-script.sh"
      - "tests/test-installer-stage.sh"
      - "scripts/configure-build-output.py"
      - ".github/workflows/live-iso.yml"

permissions:
  contents: read

jobs:
  build-live-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio file flex g++ gcc git \
            grub-common grub-pc-bin grub-efi-amd64-bin libelf-dev \
            libncurses-dev libssl-dev mtools patch perl python3 rsync \
            xorriso unzip wget xz-utils qemu-system-x86 ovmf

      - name: Build Vampire OS live ISO
        env:
          JOBS: "2"
        run: bash build/build-live-iso.sh

      - name: Validate installer rootfs archive
        run: bash scripts/test-rootfs-artifact.sh

      - name: Boot-test ISO in BIOS and UEFI
        run: bash scripts/test-live-iso.sh

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: vampire-os-live-x86_64
          path: |
            out/vampire-os-0.1.0-dev-desktop-x86_64.iso
            out/vampire-os-0.1.0-dev-desktop-x86_64.iso.sha256
            out/vampire-os-0.1.0-dev-desktop-x86_64-rootfs.tar
            out/vampire-os-0.1.0-dev-desktop-x86_64-rootfs.tar.sha256
          if-no-files-found: error
          retention-days: 14
