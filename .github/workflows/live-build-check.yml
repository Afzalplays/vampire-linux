name: Vampire OS build checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "rootfs-overlay/**"
      - "fetch/**"
      - "scripts/**"
      - "tests/**"
      - "vpm/**"
      - ".github/workflows/live-build-check.yml"
  pull_request:
    paths:
      - "build/**"
      - "rootfs-overlay/**"
      - "fetch/**"
      - "scripts/**"
      - "tests/**"
      - "vpm/**"
      - ".github/workflows/live-build-check.yml"

permissions:
  contents: read

jobs:
  shell-and-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and contracts
        run: |
          set -euxo pipefail
          bash -n build/build-live-iso.sh
          bash -n scripts/test-live-iso.sh
          bash -n tests/test-vampire-shell.sh
          bash tests/test-vampire-shell.sh
          bash -n tests/test-uefi-boot-script.sh
          bash tests/test-uefi-boot-script.sh
          bash -n fetch/vfetch
          bash -n tests/test-vfetch.sh
          bash tests/test-vfetch.sh
          sh -n rootfs-overlay/etc/init.d/rcS
          bash -n tests/test-rootfs-contract.sh
          echo '=== rootfs contract ==='
          bash -x tests/test-rootfs-contract.sh
          python3 tests/test-kernel-fragment.py
          python3 scripts/test-stage-rootfs.py
          python3 scripts/test_post_build_vampire.py
          echo '=== command tools ==='
          bash -x tests/test-command-tools.sh
          bash -n tests/test-power-controls.sh
          bash -x tests/test-power-controls.sh
          echo '=== network lifecycle ==='
          bash -x tests/test-network-lifecycle.sh
          echo '=== Wi-Fi network ==='
          bash -x tests/test-wifi-network.sh
          bash tests/test-wayland-terminal.sh
          bash tests/test-weston-launchers.sh
          bash tests/test-settings-launcher.sh
          bash tests/test-vhelp.sh
          echo '=== desktop settings ==='
          bash -x tests/test-settings-desktop.sh
          echo '=== installer preflight ==='
          bash -x tests/test-installer-preflight.sh
          bash -x tests/test-installer-requirements.sh
          bash -x tests/test-installer-stage.sh
          echo '=== service manager ==='
          bash -n tests/test-service-manager.sh
          bash -x tests/test-service-manager.sh
          bash tests/test-software-center.sh
          bash tests/test-ssh-tool.sh
          bash tests/test-files-tool.sh
          bash tests/test-diagnostics.sh
          bash -n tests/test-monitor.sh
          bash tests/test-monitor.sh
          bash -n tests/test-diagnose-save.sh
          echo '=== support snapshot export ==='
          bash -x tests/test-diagnose-save.sh
          bash -n tests/test-logs.sh
          bash tests/test-logs.sh
          bash tests/test-editions.sh
      - name: Check Buildroot configuration
        run: |
          grep -qx 'BR2_x86_64=y' build/vampire_defconfig
          grep -qx 'BR2_TOOLCHAIN_BUILDROOT_MUSL=y' build/vampire_defconfig
          grep -qx 'BR2_LINUX_KERNEL=y' build/vampire_defconfig
          grep -qx 'BR2_TARGET_ROOTFS_CPIO=y' build/vampire_defconfig
          grep -qx 'BR2_TARGET_ROOTFS_TAR=y' build/vampire_defconfig
          grep -qx 'BR2_TARGET_ROOTFS_TAR=y' build/vampire_server_defconfig
          for config in build/vampire_defconfig build/vampire_server_defconfig; do
            grep -qx 'BR2_PACKAGE_UTIL_LINUX_BINARIES=y' "$config"
            grep -qx 'BR2_PACKAGE_PARTED=y' "$config"
            grep -qx 'BR2_PACKAGE_DOSFSTOOLS_MKFS_FAT=y' "$config"
            grep -qx 'BR2_PACKAGE_E2FSPROGS=y' "$config"
            grep -qx 'BR2_TARGET_GRUB2=y' "$config"
            grep -qx 'BR2_TARGET_GRUB2_I386_PC=y' "$config"
            grep -qx 'BR2_TARGET_GRUB2_X86_64_EFI=y' "$config"
            grep -qx 'BR2_TARGET_GRUB2_INSTALL_TOOLS=y' "$config"
          done
          grep -qx 'BR2_PACKAGE_BASH=y' build/vampire_defconfig
          grep -qx 'BR2_PACKAGE_BASH=y' build/vampire_server_defconfig
          grep -qx 'BR2_PACKAGE_WESTON=y' build/vampire_defconfig
          grep -qx 'BR2_PACKAGE_FOOT=y' build/vampire_defconfig
          grep -qx 'BR2_PACKAGE_DEJAVU=y' build/vampire_defconfig
          grep -qx 'BR2_PACKAGE_IW=y' build/vampire_defconfig
          grep -qx 'BR2_PACKAGE_WPA_SUPPLICANT=y' build/vampire_defconfig
          grep -qx 'BR2_PACKAGE_WPA_SUPPLICANT_CLI=y' build/vampire_defconfig
          grep -qx 'BR2_PACKAGE_WPA_SUPPLICANT_PASSPHRASE=y' build/vampire_defconfig
          grep -qx 'BR2_PACKAGE_LINUX_FIRMWARE_IWLWIFI_9XXX=y' build/vampire_defconfig
          grep -qx 'BR2_PACKAGE_PYTHON3=y' build/vampire_defconfig
          grep -qx 'BR2_PACKAGE_MINISIGN=y' build/vampire_defconfig
          grep -qx 'BR2_PACKAGE_DROPBEAR=y' build/vampire_defconfig
          grep -qx 'BR2_PACKAGE_NFTABLES=y' build/vampire_defconfig
          grep -qx 'BR2_PACKAGE_NFTABLES=y' build/vampire_server_defconfig
          test -s scripts/post-build-vampire.py
          test -s build/grub.cfg
          test -s rootfs-overlay/etc/inittab
          test -s rootfs-overlay/etc/os-release
      - name: Test VPM
        run: python3 -m unittest discover -s vpm -p 'test_*.py' -v
      - name: Test Buildroot output configuration
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test VFetch output contract
        run: |
          bash fetch/vfetch > vfetch-output.txt
          grep -q 'V A M P I R E' vfetch-output.txt
          grep -q 'OS:' vfetch-output.txt
          grep -q 'Kernel:' vfetch-output.txt
          grep -q 'Memory:' vfetch-output.txt
          grep -q 'Locale:' vfetch-output.txt
