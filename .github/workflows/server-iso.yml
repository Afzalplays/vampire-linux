name: Vampire OS Server ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/vampire_server_defconfig"
      - "build/build-live-iso.sh"
      - "rootfs-overlay/**"
      - "vpm/**"
      - "scripts/test-live-iso.sh"
      - ".github/workflows/server-iso.yml"

permissions:
  contents: read

jobs:
  build-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio file flex g++ gcc git             grub-common grub-pc-bin grub-efi-amd64-bin libelf-dev libncurses-dev             libssl-dev mtools patch perl python3 rsync xorriso unzip wget xz-utils             qemu-system-x86 ovmf
      - name: Build Vampire OS Server ISO
        env:
          VAMPIRE_EDITION: server
          JOBS: "2"
        run: bash build/build-live-iso.sh
      - name: Boot-test server ISO in BIOS and UEFI
        env:
          VAMPIRE_EDITION: server
        run: bash scripts/test-live-iso.sh
      - name: Upload server ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: vampire-os-server-x86_64
          path: |
            out/vampire-os-0.1.0-dev-server-x86_64.iso
            out/vampire-os-0.1.0-dev-server-x86_64.iso.sha256
          if-no-files-found: error
          retention-days: 14
