# Vampire OS dark desktop preview configuration.
[core]
idle-time=0
require-input=false

[shell]
background-color=0xff08080c
background-image=/usr/share/vampire/wallpaper.png
background-type=scale-crop
panel-color=0xff111116
locking=false
panel-position=top
animation=fade
close-animation=fade
startup-animation=fade

[autolaunch]
path=/usr/bin/vampire-terminal
watch=false

[launcher]
icon=/usr/share/vampire/icons/terminal.png
path=/usr/bin/vampire-terminal

[launcher]
icon=/usr/share/vampire/icons/launcher.png
path=/usr/bin/vampire-app launcher

[launcher]
icon=/usr/share/vampire/icons/files.png
path=/usr/bin/vampire-app files

[launcher]
icon=/usr/share/vampire/icons/settings.png
path=/usr/bin/vampire-app settings

[launcher]
icon=/usr/share/vampire/icons/software.png
path=/usr/bin/vampire-app software

[launcher]
icon=/usr/share/vampire/icons/monitor.png
path=/usr/bin/vampire-app monitor
