# Vampire OS dark desktop preview configuration.
[core]
idle-time=0
require-input=false

[shell]
background-color=0xff08080c
panel-color=0xff111116
locking=false
panel-position=top
animation=fade
close-animation=fade
startup-animation=fade

[autolaunch]
path=/usr/bin/vampire-terminal
watch=false

[launcher]
icon=/usr/share/weston/icon_terminal.png
path=/usr/bin/vampire-terminal

[launcher]
icon=/usr/share/weston/home.png
path=/usr/bin/vampire-app files

[launcher]
icon=/usr/share/weston/icon_editor.png
path=/usr/bin/vampire-app settings

[launcher]
icon=/usr/share/weston/icon_flower.png
path=/usr/bin/vampire-app software
